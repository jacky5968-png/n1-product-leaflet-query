<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d39"><meta name="description" content="生達產品仿單與問答查詢：依品名、成分、關鍵字及問答分類搜尋，保留原始來源與仿單依據。"><title>全產品仿單｜互動查詢</title>
<style>:root{
  color-scheme:light;
  --ink:#173e39;--muted:#60736e;--green:#1b6256;--bg:#f5f6f2;
  --line:#dce5df;--soft:#edf3ee;--gold:#b59a63;
  --shadow:0 8px 32px #193e3510;--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.75 "Microsoft JhengHei","微軟正黑體",sans-serif;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
button,input,select,textarea{font:inherit}
button,a,input,select,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button,a{transition:background .18s,border-color .18s,box-shadow .18s}
a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
header{color:white;background:#153f39;border-bottom:3px solid var(--gold)}
.topbar{max-width:1328px;margin:auto;padding:26px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand-mark{width:48px;height:54px;display:grid;place-items:center;flex:none;border:1px solid #92b0a36e;border-radius:13px;background:#ffffff08;color:#e7efe8}
.brand-mark svg{width:26px;height:30px}
.eyebrow{font-size:11px;letter-spacing:2.4px;color:#bdd0c5;margin-bottom:5px}
.brand-title{font-size:24px;line-height:1.5;font-weight:700;letter-spacing:1.5px}
.wrap{max-width:1328px;margin:0 auto;padding:36px 40px 64px}
.search-panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:30px 32px;box-shadow:var(--shadow);margin-bottom:32px}
.query-inputs{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.query-field{min-width:0}
.query-field>label{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:14px}
.step{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;background:var(--soft);color:var(--green);border:1px solid #dbe7de;border-radius:9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.search-box{display:flex;gap:12px;align-items:center;min-height:62px;border:1px solid #bdcec4;border-radius:12px;padding:0 17px;background:#fbfcfa;transition:border-color .18s,box-shadow .18s}
.search-box:focus-within{border-color:var(--green);box-shadow:0 0 0 4px #1b625615;background:white}
.search-icon{font-size:25px;color:var(--green);display:grid;place-items:center;flex:none;line-height:1}
.search-icon svg{width:21px;height:21px}
input[type=search]{font-size:17px;width:100%;min-width:0;min-height:60px;border:0;background:transparent;padding:14px 0;color:var(--ink);outline:none}
input::placeholder{color:#798780;opacity:1}
.suggestions{margin-top:12px;font-size:14px}
.suggestion-label,.suggestion-hint{font-size:13px;line-height:1.75;color:var(--muted)}
.suggestion-label{display:block;margin-bottom:10px}
.suggestion-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;max-height:250px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#a6b9ad transparent;padding:2px 4px 4px 2px}
.suggestion{min-height:52px;max-width:100%;border:1px solid #dce6de;background:#f8faf6;border-radius:10px;padding:12px 14px;text-align:left;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.suggestion span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.suggestion.chosen{background:#eaf3ec;border-color:#7da590;color:#185344;box-shadow:inset 3px 0 0 #2d715c}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:24px}
.quick>span{font-size:13px;color:var(--muted);margin-right:6px}
.chip{border:1px solid #e1e8e0;background:#f3f6f0;border-radius:24px;padding:9px 16px;min-height:44px;font-size:14px;line-height:1.5;color:#456459}
.query-confirmation{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--line);padding-top:24px;margin-top:26px}
.query-preview{min-width:0;font-size:14px;color:var(--muted);line-height:1.8}
.query-preview strong{display:block;color:var(--ink);font-size:17px;overflow-wrap:anywhere;font-weight:700}
.preview-label{font-size:12px;letter-spacing:1px;display:block;margin-bottom:4px}
.query-actions{display:flex;gap:10px;flex:none}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:46px;padding:10px 20px;border:1px solid #cddbd1;border-radius:10px;background:white;white-space:nowrap;line-height:1.5;font-size:15px}
.btn.primary{background:var(--green);border-color:var(--green);color:white;box-shadow:0 3px 8px #1b625618}
.query-actions .primary{min-width:124px}
.btn.small{font-size:13px;min-height:44px;padding:9px 14px}
.btn.active{background:#eaf3ec;border-color:#89ac99;color:var(--green)}
.btn:disabled{background:#e2e9e4;border-color:#d7e1da;color:#60776b;box-shadow:none;cursor:not-allowed;opacity:1}
.text-btn{border:0;background:transparent;color:var(--green);font-size:13px;line-height:1.6;padding:10px 6px;min-height:44px;border-radius:6px}
.query-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px}
.minor-note{font-size:13px;color:var(--muted);line-height:1.8;margin:0}
.query-tools p{flex:1;min-width:180px;margin:0}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.catalog{min-width:0;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fafbf8;padding:16px 18px;border-bottom:1px solid var(--line);font-size:14px}
.catalog-head>span{font-size:12px;color:var(--muted)}
.product-list{padding:8px;scrollbar-width:thin;scrollbar-color:#a6b9ad transparent}
.product{position:relative;display:block;text-align:left;width:100%;border:1px solid transparent;border-radius:10px;background:white;padding:16px 12px;line-height:1.65;min-width:0}
.product+.product{margin-top:3px}
.product.selected{background:#edf4eb;border-color:#c4d8c5;box-shadow:inset 3px 0 0 #2b6c58}
.product .en{display:block;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.product .cn{display:block;font-size:13px;color:#587264;margin:4px 0 10px;overflow-wrap:anywhere}
.product-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:start;gap:7px;color:var(--muted);font-size:12px}
.tag{display:inline-block;max-width:100%;font-size:12px;line-height:1.6;color:#37634d;background:#e9f0e6;border:1px solid #dfe8dc;border-radius:6px;padding:3px 8px;overflow-wrap:anywhere}
.workspace{min-width:0}
.product-panel{border:1px solid var(--line);border-radius:var(--radius);background:white;padding:28px 30px;box-shadow:0 4px 20px #193e3505}
.detail-top{display:flex;justify-content:space-between;align-items:start;gap:24px}
.detail-top>div:first-child{min-width:0}
.detail-top h2{font-size:clamp(26px,2.6vw,34px);line-height:1.4;letter-spacing:-.5px;margin:10px 0 5px;overflow-wrap:anywhere}
.cn-title{font-size:17px;color:#587264;line-height:1.8;margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:265px}
/* 查詢介面不顯示收藏與手動更新按鈕；保留節點以維持既有事件綁定。 */
#favorites,#refresh,#saveProduct{display:none!important}
.meta-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px 28px;padding-top:24px;margin-top:24px;border-top:1px solid var(--line)}
.meta-item{font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.meta-label{display:block;font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px}
.section-head h3{font-size:18px;margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.count-badge{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.faq{background:white;border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:0 4px 18px #193e3504}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:14px;padding:22px 26px;font-weight:700;font-size:17px;line-height:1.75}
.faq summary::-webkit-details-marker{display:none}
.question-title{min-width:0;overflow-wrap:anywhere}
.faq summary::after{content:'＋';align-self:center;margin-left:auto;font-size:20px;font-weight:400;color:var(--green);flex:none}
.faq[open] summary{background:#f7f9f4;border-bottom:1px solid var(--line)}
.faq[open] summary::after{content:'−'}
.faq-index{font-size:12px;font-weight:400;color:#7c9382;flex:none;font-variant-numeric:tabular-nums}
.faq-body{padding:26px 30px 18px;font-size:17px}
.answer{white-space:pre-wrap;margin:0 0 20px;line-height:2;overflow-wrap:anywhere;max-width:68ch}
.answer>strong{font-weight:700}
.note{font-size:14px;line-height:1.9;color:#76603b;background:#faf7ed;border-left:3px solid #c7b88d;border-radius:0 9px 9px 0;padding:13px 16px;white-space:pre-wrap;margin-top:18px;overflow-wrap:anywhere}
.faq-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:13px}
.empty{text-align:center;border:1px dashed #c1d0c3;border-radius:14px;padding:36px 24px;background:white;color:var(--muted);font-size:15px}
.empty strong{display:block;color:var(--ink);margin-bottom:8px}
.error{background:#fff4e5;border:1px solid #e9d2b2;border-radius:12px;padding:16px;color:#79511c;white-space:pre-wrap;margin-bottom:20px;font-size:14px}
mark{color:inherit;background:#f3e9bf;border-radius:3px;padding:0 2px}
.compare-tray{position:fixed;z-index:4;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;justify-content:space-between;align-items:center;gap:20px;max-width:1000px;width:calc(100% - 48px);padding:16px 20px;border:1px solid #b9cbbb;border-radius:16px;background:#eff5eb;box-shadow:0 8px 36px #173e3926;font-size:14px}
.compare-tray>span{min-width:0;overflow-wrap:anywhere}.compare-tray>div{display:flex;gap:8px;flex:none}
body:has(.compare-tray:not([hidden])) .wrap{padding-bottom:180px}
dialog{max-width:1200px;width:calc(100% - 48px);max-height:85vh;max-height:85dvh;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:20px;padding:28px;color:var(--ink);background:#f5f7f1;box-shadow:0 20px 80px #102f3a26}
dialog::backdrop{background:#102c2a99;backdrop-filter:blur(3px)}
.dialog-header{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:22px}
.dialog-header h2{font-size:22px;line-height:1.5;margin:0 0 6px}
select{min-height:44px;max-width:100%;font-size:16px;padding:8px 12px;color:var(--ink);background:white;border:1px solid #bfcec2;border-radius:8px}
.compare-grid{display:grid;gap:16px;align-items:start;margin-top:20px}
.compare-card{min-width:0;background:white;border:1px solid var(--line);border-radius:14px;padding:22px;overflow-wrap:anywhere}
.compare-card h3{font-size:21px;margin:10px 0 4px}.compare-card .question-title{font-size:15px;margin-top:22px}.compare-card .answer{font-size:16px;line-height:2}
.toast{position:fixed;z-index:6;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);border-radius:10px;padding:12px 22px;background:#173e39;color:white;box-shadow:0 5px 24px #173e3930;font-size:14px}
body:has(.compare-tray:not([hidden])) .toast{bottom:150px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line);color:#64766c;font-size:12px;line-height:1.8}
@media(hover:hover){.btn:hover:not(:disabled){background:#f0f5ed;border-color:#a9c0ae}.btn.primary:hover:not(:disabled){background:#134f45;border-color:#134f45}.text-btn:hover{background:#edf3e9}.chip:hover{background:#e6eee1;border-color:#bccfbf}.suggestion:hover{background:#edf4e8;border-color:#8dab91}.product:hover:not(.selected){background:#f6f9f2}.faq summary:hover{background:#f2f6ed}}
@media(min-width:1100px){.catalog{position:sticky;top:24px}.product-list{max-height:calc(100dvh - 130px);overflow:auto}}
@media(max-width:1099px){.topbar{padding:24px 30px}.wrap{padding:30px 30px 60px}.layout{grid-template-columns:minmax(0,1fr);gap:24px}.product-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:240px;overflow:auto;padding:10px}.product+.product{margin-top:0}.product-panel{padding:28px}.compare-grid{grid-template-columns:1fr!important}}
@media(max-width:899px){.query-inputs{grid-template-columns:minmax(0,1fr);gap:26px}.search-panel{padding:28px}.suggestion-options{grid-template-columns:repeat(2,minmax(0,1fr));max-height:230px}.actions{max-width:240px}.detail-top{flex-wrap:wrap}.actions{justify-content:flex-start}.query-tools p{flex-basis:100%}}
@media(max-width:599px){
  .topbar{padding:20px max(20px,env(safe-area-inset-left,0px));min-height:100px}.brand{gap:12px}.brand-mark{width:39px;height:46px;border-radius:11px}.brand-mark svg{width:23px;height:27px}.eyebrow{font-size:9px;letter-spacing:1.7px;margin-bottom:4px}.brand-title{font-size:20px;letter-spacing:.7px}
  .wrap{padding:22px 16px 44px}.search-panel{border-radius:16px;padding:22px 18px;margin-bottom:24px}.query-inputs{gap:24px}.query-field>label{font-size:16px;margin-bottom:12px}.step{width:26px;height:26px}.search-box{min-height:58px;padding:0 13px;gap:10px}input[type=search]{min-height:56px;font-size:16px;padding:12px 0}
  .suggestion-options{grid-template-columns:minmax(0,1fr);max-height:230px;gap:8px}.suggestion{padding:12px 14px;font-size:15px;min-height:48px}.suggestion span{font-size:12px}.suggestion-hint,.suggestion-label{font-size:13px}.quick{display:grid;grid-template-columns:repeat(5,max-content);gap:8px;margin-top:22px;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:4px}.quick>span{grid-column:1/-1;margin:0 0 2px;white-space:nowrap}.chip{font-size:13px;padding:9px 13px;white-space:nowrap}
  .query-confirmation{flex-direction:column;align-items:stretch;gap:18px;padding-top:20px;margin-top:22px}.query-preview{font-size:14px}.query-preview strong{font-size:16px}.query-actions{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}.query-actions .btn{min-height:48px;font-size:16px}.query-tools{gap:10px 16px;margin-top:18px}.query-tools p{min-width:0}.minor-note{font-size:13px}.query-tools .btn{flex:1}.query-tools .text-btn{padding:10px 12px}
  .layout{gap:20px}.catalog{border-radius:14px}.catalog-head{padding:14px 16px}.product-list{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;max-height:none;padding:10px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}.product{flex:0 0 80%;max-width:280px;min-width:0;padding:14px 16px;scroll-snap-align:start}.product .en{font-size:17px}.product .cn{font-size:13px}.product-bottom{font-size:12px}.product-panel{padding:22px 20px;border-radius:16px}.detail-top{gap:18px}.detail-top h2{font-size:28px;letter-spacing:0}.cn-title{font-size:16px}.actions{max-width:none;width:100%;gap:8px}.actions .btn{flex:1;font-size:12px;padding:9px 10px}.meta-grid{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:20px;margin-top:20px}.meta-item{font-size:14px}.meta-label{font-size:12px}
  .section-head{margin:24px 0 12px;gap:8px;align-items:center}.section-head h3{font-size:17px;gap:6px}.count-badge{font-size:12px}.section-head .btn{font-size:12px;min-height:44px;padding:8px 12px}.faq{border-radius:14px}.faq summary{padding:18px 16px;gap:10px;font-size:16px}.faq-index{font-size:11px}.faq-body{padding:22px 20px 14px;font-size:16px}.answer{font-size:16px;line-height:2;margin-bottom:18px}.note{font-size:13px;line-height:1.9;padding:12px 13px}.faq-footer{margin-top:10px}.text-btn{font-size:13px}
  .compare-tray{bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);padding:14px 16px;gap:12px;flex-direction:column;align-items:stretch;font-size:13px}.compare-tray>div .btn{flex:1}.compare-tray>span{line-height:1.7}body:has(.compare-tray:not([hidden])) .wrap{padding-bottom:230px}body:has(.compare-tray:not([hidden])) .toast{bottom:190px}
  dialog{width:calc(100% - 24px);padding:20px 16px;border-radius:16px;max-height:88dvh}.dialog-header{gap:10px;margin-bottom:18px}.dialog-header h2{font-size:19px}.dialog-header .btn{padding:8px 10px;font-size:12px;flex:none}.compare-card{padding:20px}.compare-card .answer{font-size:16px}.compare-grid{gap:12px}footer{display:block;font-size:12px;margin-top:28px;padding-top:18px}footer span{display:block;margin-top:5px}
}
@media(max-width:359px){.wrap{padding-left:12px;padding-right:12px}.search-panel{padding:20px 14px}.brand-title{font-size:18px}.eyebrow{font-size:8px}.faq-body{padding:20px 16px}.actions{flex-direction:column}.actions .btn{width:100%}.query-actions{grid-template-columns:1.4fr 1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
@media print{header,.search-panel,.catalog,.actions,.section-head button,.faq-footer,.compare-tray,footer{display:none!important}.wrap{padding:0;max-width:none}.layout{display:block}.product-panel,.faq{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.faq-body{display:block!important}body{background:white;color:black}.faq:not([open]){display:none}dialog{position:static;max-width:none;width:100%;max-height:none}dialog::backdrop{display:none}}
</style></head>
<body>
<header><div class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 32" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2h11l6 6v22H5V2h1Z"/><path d="M17 2v7h6M9 15h10M9 20h10M9 25h6"/></svg></div><div><div class="eyebrow">PRODUCT REFERENCE LIBRARY</div><div class="brand-title">生達・全產品仿單</div></div></div></div></header>

: 4}, {"category": "適應症", "answer": "高膽固醇血症、高三酸甘油脂血症；另適用於符合仿單所列條件之第二型糖尿病或高血壓病人，以降低指定心血管事件風險。", "evidence": "2／第1–3頁", "note": "心血管預防適用條件另列追加項目，不將適應症擴大到所有病人。", "row": 5}, {"category": "用法用量", "answer": "劑量範圍10–80 mg，每日一次；早晚不拘，隨餐或空腹均可。依LDL-C基礎值、目標及反應個別調整；開始治療或調整劑量後2–4週檢查血脂。", "evidence": "3.1／第3頁", "note": "每日劑量範圍與本錠規格不同，不等於每位病人均可使用最高劑量。", "row": 6}, {"category": "特殊族群與劑量調整", "answer": "10–17歲異型接合子家族型高膽固醇血症病人，建議起始10 mg/日，最高建議20 mg/日；每次調整至少間隔4週。", "evidence": "3.3／第3頁", "note": "大於20 mg之劑量未在此兒童族群研究；適用條件須併核第2章。", "row": 7}, {"category": "肝功能是否需調整劑量", "answer": "仿單未提供可通用的肝功能減量公式。禁忌包括急性肝衰竭或失代償性肝硬化；6.6另記載活動性肝病及肝轉胺酶不明原因持續升高者禁用。", "evidence": "3.3、4、6.6／第3–4、8頁", "note": "不得解讀為肝功能不全無須調整或均可使用。", "row": 8}, {"category": "腎功能是否需調整劑量", "answer": "腎臟疾病不影響atorvastatin血漿濃度及降低LDL-C之療效，仿單記載腎功能不全病人無須調整劑量。", "evidence": "3.3／第3頁", "note": "腎功能不全仍是肌病風險因子，須併核警語。", "row": 9}, {"category": "錠劑可否剝半", "answer": "本規格外觀明載剝半線；但仿單未明載分割後等量性或分割服用方式，使用前須向藥品技術單位確認。", "evidence": "1.4／第1頁", "note": "有剝半線或刻字，均不自行等同已確認可等量分割。", "row": 10}, {"category": "懷孕分級", "answer": "仿單未標示A／B／C／D／X懷孕分級；懷孕期間禁用，若發現懷孕應立即停用。", "evidence": "4、6.1／第4、6–7頁", "note": "不得自行補寫舊制懷孕分級。", "row": 11}, {"category": "禁忌症", "answer": "急性肝衰竭或失代償性肝硬化、對任何成分過敏、懷孕及哺乳者禁用；活動性肝病限制另見6.6。", "evidence": "4、6.6／第3–4、8頁", "note": "與交互作用中「不建議併用」的語意分開。", "row": 12}, {"category": "警語及注意事項", "answer": "重要警語包括肌病／橫紋肌溶解症、免疫介導壞死性肌病、肝功能異常、HbA1c或血糖升高、近期中風／TIA族群及重症肌無力。", "evidence": "5.1／第4–6頁", "note": "肌肉症狀與肝功能監測另拆成追加項目。", "row": 13}, {"category": "藥物交互作用", "answer": "CYP3A4及運輸蛋白抑制劑可增加暴露量與肌病風險。不建議與cyclosporine、gemfibrozil等併用；特定抗病毒藥、clarithromycin及itraconazole有個別劑量限制。", "evidence": "7.1／第8–9頁", "note": "本列為摘要；重要併用上限另列，不把「不建議」改成「禁忌」。", "row": 14}, {"category": "副作用與不良反應", "answer": "重要不良反應包括肌病、橫紋肌溶解症及肝臟酵素異常。臨床試驗常通報鼻咽炎、關節痛、腹瀉、四肢疼痛及尿道感染；另有頻率未知之重症肌無力、眼肌型肌無力症。", "evidence": "8.1–8.2／第10頁", "note": "試驗通報不考慮因果；不與其他產品之副作用率直接比較。", "row": 15}, {"category": "作用機轉及藥理特性", "answer": "Atorvastatin為HMG-CoA還原酶抑制劑，可抑制膽固醇生合成，增加肝臟LDL受體以促進LDL攝取及分解。", "evidence": "10.1／第13頁",   $('nameSuggestions').hidden=namePending||!tokens().length;
  $('nameSuggestions').innerHTML=!tokens().length?'<span class="suggestion-hint">輸入中英文商品名或成分名，會列出符合品項。</span>':list.length?'<span class="suggestion-label">符合品項 '+list.length+' 項，可點選指定規格</span><div class="suggestion-options">'+list.map(p=>`<button class="suggestion" data-name="${esc(p.name)}">${esc(p.name)}<span>${esc(p.chinese)}</span></button>`).join('')+'</div>':'<span class="suggestion-hint">找不到符合的商品名或成分名，請修改輸入。</span>';
  $('questionSuggestions').innerHTML=!$('question').value.trim()?'<span class="suggestion-hint">輸入問題，下方會顯示來源中的標準問法。</span>':matches.length?'<span class="suggestion-label">建議問法，可點選確認</span><div class="suggestion-options">'+matches.slice(0,8).map(m=>`<button class="suggestion ${resolvedCategory===m.category?'chosen':''}" data-question="${esc(m.category)}" aria-pressed="${resolvedCategory===m.category}">${esc(m.category)}</button>`).join('')+'</div>':'<span class="suggestion-hint">未找到對應問法，請改用「懷孕」「腎功能」「副作用」等詞。</span>';
  const ready=!namePending&&list.length&&resolvedCategory,matched=list.filter(p=>p.faqs.some(f=>f.category===resolvedCategory));$('confirmQuery').disabled=!ready||!matched.length;
  if(namePending){$('queryPreview').textContent='請完成商品名或成分名輸入。';$('queryHint').textContent='停止輸入後會顯示符合品項。';return;}
  if(ready&&matched.length){const names=matched.slice(0,3).map(p=>p.name).join('、')+(matched.length>3?' 等 '+matched.length+' 項產品':'');$('queryPreview').innerHTML='<span class="preview-label">您要查詢的是</span><strong>'+esc(names)+' 的「'+esc(resolvedCategory)+'」</strong>';$('queryHint').textContent=matched.length>1?'符合 '+matched.length+' 項規格；按「查詢」後可在結果清單切換各項答案。':'確認品項與標準問法後，按「查詢」顯示答案。';}
  else{$('queryPreview').textContent=!tokens().length?'請先輸入商品名或成分名。':!list.length?'目前沒有符合的品項。':!$('question').value.trim()?'請輸入您想查詢的問題。':matches.length>1&&!resolvedCategory?'請點選上方其中一個建議問法。':'目前來源沒有符合的問法。';$('queryHint').textContent='輸入或修改條件時，下方資料保持空白；按「查詢」後才會顯示答案。';}}
function changeCriteria(){confirmed=false;selectedId='';updateChoices();render();}
function finishNameInput(){if(nameComposing)return;clearTimeout(nameTimer);namePending=false;changeCriteria();}
function scheduleNameChoices(){clearTimeout(nameTimer);namePending=!!tokens().length;changeCriteria();if(namePending&&!nameComposing)nameTimer=setTimeout(finishNameInput,600);}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function categories(){return [...new Set(DATA.products.flatMap(p=>p.faqs.map(f=>f.category)))];}
function hydrate(){clearTimeout(nameTimer);namePending=false;confirmed=false;updateChoices();
$('errors').innerHTML=(DATA.errors||[]).map(e=>`<div class="error">${esc(e)}</div>`).join('');render();}
function render(){$('resultsLayout').hidden=!confirmed;updateTray();if(!confirmed){$('products').innerHTML='';$('detail').innerHTML='';$('answers').innerHTML='';$('resultCount').textContent='';$('answerCount').textContent='';return;}const list=visibleProducts();if(!list.some(p=>p.id===selectedId))selectedId=list[0]?.id||'';$('resultCount').textContent=`${list.length} 項`;$('products').innerHTML=list.length?list.map(p=>`<button class="product ${p.id===selectedId?'selected':''}" data-product="${esc(p.id)}" aria-pressed="${p.id===selectedId}" aria-label="選擇 ${esc(p.name)}"><span class="en">${highlight(p.name)} ${saved.has(p.id)?'★':''}</span><span class="cn">${highlight(p.chinese)}</span><span class="product-bottom"><span class="tag">${esc(p.ingredient)}</span><span>${matchingFaqs(p).length} 則問答</span></span></button>`).join(''):'<div class="empty"><strong>沒有符合的產品問答</strong>請調整商品名、成分名或查詢問題。</div>';
const p=list.find(p=>p.id===selectedId);$('expandAll').disabled=!p;if(!p){$('detail').innerHTML='<div class="empty"><strong>查無符合結果</strong>可搜尋中英文品名、成分或問答文字。<br>若已開啟收藏，請先取消收藏篩選。</div>';$('answers').innerHTML='';$('answerCount').textContent='0 則';return;}
$('detail').innerHTML=`<article class="product-panel"><div class="detail-top"><div><span class="tag">${esc(p.ingredient)}</span><h2>${highlight(p.name)}</h2><p class="cn-title">${highlight(p.chinese)}</p></div><div class="actions"><button class="btn small ${saved.has(p.id)?'active':''}" id="saveProduct" aria-pressed="${saved.has(p.id)}">${saved.has(p.id)?'★ 已收藏':'☆ 收藏產品'}</button><button class="btn small ${compared.has(p.id)?'active':''}" id="addCompare">${compared.has(p.id)?'✓ 已加入比較':'＋ 加入比較'}</button></div></div><div class="meta-grid"><div class="meta-item"><span class="meta-label">成分與含量・來源原文</span>${highlight(p.ingredientText)}</div><div class="meta-item"><span class="meta-label">許可證字號</span>${highlight(p.license)}</div></div></article>`;
const faqs=matchingFaqs(p);$('answerCount').textContent=`${faqs.length} / ${p.faqs.length} 則`;$('answers').innerHTML=faqs.map((f,i)=>`<details class="faq" open><summary><span class="faq-index">${String(i+1).padStart(2,'0')}</span><span class="question-title">題目：${highlight(p.name)} 的「${highlight(f.category)}」</span></summary><div class="faq-body"><p class="answer"><strong>答案：</strong>${highlight(f.answer)}</p>${f.note?`<div class="note"><strong>查核／使用提醒</strong>　${highlight(f.note)}</div>`:''}<div class="faq-footer" style="justify-content:flex-end"><button class="text-btn" data-copy="${f.row}">複製回答</button></div></div></details>`).join('');$('expandAll').textContent='展開全部';}
function updateTray(){$('compareTray').hidden=!confirmed||compared.size===0;$('compareText').textContent='比較清單（'+compared.size+'/3）：'+DATA.products.filter(p=>compared.has(p.id)).map(p=>p.name).join('、');$('openCompare').disabled=compared.size<2;}
function reset(){clearTimeout(nameTimer);namePending=false;nameComposing=false;$('search').value='';$('question').value='';selectedId='';onlySaved=false;$('favorites').classList.remove('active');$('favorites').setAttribute('aria-pressed','false');changeCriteria();}
function showInfo(title,html){$('infoTitle').textContent=title;$('infoBody').innerHTML=html;$('infoDialog').showModal();}
function help(){showInfo('來源與使用說明',`<p>第一欄輸入商品名或成分名，第二欄輸入問題。下方會列出符合品項、來源中的標準問法，以及完整詢問用詞。可點選指定規格或建議問法，再按「查詢」閱讀來源答案。遇到多種問法時，請先點選一個建議；修改輸入或清除後，下方資料會收起，須再次查詢。問題提示依來源分類與常見用語比對，答案仍完整沿用來源內容。</p><p>使用「收藏產品」保存常用產品；同題比較可加入 2–3 項產品。每則回答均保留原始仿單依據與查核提醒。</p><p><strong>資料更新：</strong>${DATA.mode==='live'?'目前為雲端版本。按更新資料會重新讀取來源資料夾。':'目前為本機資料快照，雙擊即可使用，不會自動同步 Google Drive。更新步驟請見同資料夾的「使用說明.html」。雲端即時版程式亦已附於 apps-script 資料夾，需由檔案擁有者完成部署。'}</p><p>原始文件會依 Google Drive 權限開啟；本頁不修改來源。PDF 連結依現有索引唯一檔名對應，未另驗證是否為最新版本。</p><p class="minor-note">來源資料夾：<a href="${esc(DATA.folderUrl)}" target="_blank" rel="noopener">開啟 Google Drive ↗</a></p>`);}
function renderComparison(){const cat=$('compareCategory').value;const ps=DATA.products.filter(p=>compared.has(p.id));$('compareGrid').style.gridTemplateColumns=`repeat(${ps.length},minmax(0,1fr))`;$('compareGrid').innerHTML=ps.map(p=>{const fs=p.faqs.filter(f=>f.category===cat);return `<article class="compare-card"><span class="tag">${esc(p.ingredient)}</span><h3>${esc(p.name)}</h3><div>${esc(p.chinese)}</div>${fs.length?fs.map(f=>`<p class="question-title"><strong>題目：${esc(p.name)} 的「${esc(f.category)}」</strong></p><p class="answer"><strong>答案：</strong>${esc(f.answer)}</p>${f.note?`<div class="note">${esc(f.note)}</div>`:''}`).join(''):'<div class="empty">此產品來源未列此分類</div>'}</article>`;}).join('');}
async function refresh(){if(!(window.google&&google.script&&google.script.run)){help();return;}$('refresh').disabled=true;$('refresh').textContent='讀取中…';google.script.run.withSuccessHandler(data=>{try{if(!data||!Array.isArray(data.products))throw Error('資料格式不符');DATA=data;hydrate();toast('已重新讀取雲端資料');}catch(e){toast('讀取失敗，保留原資料');}finally{$('refresh').disabled=false;$('refresh').textContent='更新資料';}}).withFailureHandler(error=>{$('refresh').disabled=false;$('refresh').textContent='更新資料';$('errors').textContent='雲端讀取失敗，畫面保留上次資料：'+(error.message||error);$('errors').className='error';}).getLibraryData();}
$('search').addEventListener('input',scheduleNameChoices);$('search').addEventListener('compositionstart',()=>{nameComposing=true;scheduleNameChoices();});$('search').addEventListener('compositionend',()=>{nameComposing=false;scheduleNameChoices();});$('search').addEventListener('blur',()=>{if(namePending)finishNameInput();});$('question').addEventListener('input',changeCriteria);$('reset').onclick=reset;$('favorites').onclick=()=>{onlySaved=!onlySaved;$('favorites').classList.toggle('active',onlySaved);$('favorites').setAttribute('aria-pressed',String(onlySaved));changeCriteria();};$('refresh').onclick=refresh;$('confirmQuery').onclick=()=>{if($('confirmQuery').disabled)return;confirmed=true;render();$('queryHint').textContent='已顯示上述詢問用詞的來源答案；修改輸入後請再次查詢。';};
document.querySelectorAll('[data-query]').forEach(el=>el.onclick=()=>{$('question').value=el.dataset.query;changeCriteria();});
$('nameSuggestions').onclick=e=>{const b=e.target.closest('[data-name]');if(!b)return;$('search').value=b.dataset.name;changeCriteria();};
$('questionSuggestions').onclick=e=>{const b=e.target.closest('[data-question]');if(!b)return;$('question').value=b.dataset.question;changeCriteria();};
for(const id of ['search','question'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!nameComposing){if(namePending)finishNameInput();if(!$('confirmQuery').disabled){e.preventDefault();$('confirmQuery').click();}}});
$('products').onclick=e=>{const b=e.target.closest('[data-product]');if(!b)return;selectedId=b.dataset.product;try{history.replaceState(null,'','#'+encodeURIComponent(selectedId));}catch(err){}render();};
$('detail').onclick=e=>{const p=DATA.products.find(p=>p.id===selectedId);if(!p)return;const id=e.target.closest('button')?.id;if(id==='saveProduct'){saved.has(p.id)?saved.delete(p.id):saved.add(p.id);try{localStorage.setItem('leaflet-favorites-v1',JSON.stringify([...saved]));}catch(err){toast('此瀏覽器無法保存收藏，暫存於本次頁面');}render();}if(id==='addCompare'){if(compared.has(p.id))compared.delete(p.id);else if(compared.size>=3){toast('最多同時比較 3 項產品');return;}else compared.add(p.id);updateTray();render();}};
$('answers').onclick=async e=>{const button=e.target.closest('[data-copy]');if(!button)return;const p=DATA.products.find(p=>p.id===selectedId),f=p.faqs.find(f=>String(f.row)===button.dataset.copy);const t=`題目：${p.name} 的「${f.category}」\n答案：${f.answer}${f.note?'\n查核／使用提醒：'+f.note:''}`;try{await navigator.clipboard.writeText(t);toast('已複製回答');}catch(err){showInfo('複製回答','<p>請選取下方文字後複製。</p><textarea readonly style="width:100%;height:280px;font:inherit">'+esc(t)+'</textarea>');}};
$('expandAll').onclick=()=>{const details=[...document.querySelectorAll('.faq')];const open=details.some(d=>!d.open);details.forEach(d=>d.open=open);$('expandAll').textContent=open?'收合全部':'展開全部';};$('clearCompare').onclick=()=>{compared.clear();updateTray();render();};$('openCompare').onclick=()=>{const cats=categories();$('compareCategory').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');$('compareCategory').value=resolvedCategory||'用法用量';renderComparison();$('compareDialog').showModal();};$('compareCategory').onchange=renderComparison;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
try{selectedId=decodeURIComponent(location.hash.slice(1));}catch(err){}hydrate();if(window.google&&google.script&&google.script.run)refresh();
</script></body></html>
