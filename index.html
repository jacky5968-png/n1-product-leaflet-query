, "version": "2025-12-10", "pdfName": "A表／高血脂／Atorva 40mg.pdf", "pdfUrl": "https://drive.google.com/file/d/1QNCT7zkDSiMywNj1VbArSK8Dkclpg3OZ/view", "sourceName": "Atorva 40mg_LINE_FAQ", "sourceUrl": "https://docs.google.com/spreadsheets/d/1MijHkH9Bev6cE8rP4v9gZc_ipXMgGJxMad0S8Qbl8JA/edit?gid=247607966#gid=247607966", "sheetName": "工作表1", "faqs": [{"category": "商品名", "answer": "「生達」立舒脂膜衣錠40毫克；Atorva 40mg；成分為atorvastatin。許可證：衛署藥製字第055268號。", "evidence": "表頭／第1頁", "note": "版本日期：2025-12-10；本表只對應40mg品項。", "row": 2}, {"category": "成分與含量", "answer": "本檔對應40mg規格。仿單1.1原載「每錠含atorvastatin calcium……10mg、20、40mg」，為多規格共用之成分敘述。", "evidence": "1.1／第1頁", "note": "保留仿單原載，不將三個規格含量相加，也不另作鹽類重量換算。", "row": 3}, {"category": "劑型與外觀", "answer": "膜衣錠；橢圓白色雙凸膜衣錠，一面標示STD，另一面標示290且有剝半線。", "evidence": "1.3–1.4／第1頁", "note": "只擷取本品項之規格外觀。", "row": 4}, {"category": "適應症", "answer": "高膽固醇血症、高三酸甘油脂血症；另適用於符合仿單所列條件之第二型糖尿病或高血壓病人，以降低指定心血管事件風險。", "evidence": "2／第1–3頁", "note": "心血管預防適用條件另列追加項目，不將適應症擴大到所有病人。", "row": 5}, {"category": "用法用量", "answer": "劑量範圍10–80 mg，每日一次；早晚不拘，隨餐或空腹均可。依LDL-C基礎值、目標及反應個別調整；開始治療或調整劑量後2–4週檢查血脂。", "evidence": "3.1／第3頁", "note": "每日劑量範圍與本錠規格不同，不等於每位病人均可使用最高劑量。", "row": 6}, {"category": "特殊族群與劑量調整", "answer": "10–17歲異型接合子家族型高膽固醇血症病人，建議起始10 mg/日，最高建議20 mg/日；每次調整至少間隔4週。", "evidence": "3.3／第3頁", "note": "大於20 mg之劑量未在此兒童族群研究；適用條件須併核第2章。", "row": 7}, {"category": "肝功能是否需調整劑量", "answer": "仿單未提供可通用的肝功能減量公式。禁忌包括急性肝衰竭或失代償性肝硬化；6.6另記載活動性肝病及肝轉胺酶不明原因持續升高者禁用。", "evidence": "3.3、4、6.6／第3–4、8頁", "note": "不得解讀為肝功能不全無須調整或均可使用。", "row": 8}, {"category": "腎功能是否需調整劑量", "answer": "腎臟疾病不影響atorvastatin血漿濃度及降低LDL-C之療效，仿單記載腎功能不全病人無須調整劑量。", "evidence": "3.3／第3頁", "note": "腎功能不全仍是肌病風險因子，須併核警語。", "row": 9}, {"category": "錠劑可否剝半", "answer": "本規格外觀明載剝半線；但仿單未明載分割後等量性或分割服用方式，使用前須向藥品技術單位確認。", "evidence": "1.4／第1頁", "note": "有剝半線或刻字，均不自行等同已確認可等量分割。", "row": 10}, {"category": "懷孕分級", "answer": "仿單未標示A／B／C／D／X懷孕分級；懷孕期間禁用，若發現懷孕應立即停用。", "evidence": "4、6.1／第4、6–7頁", "note": "不得自行補寫舊制懷孕分級。", "row": 11}, {"category": "禁忌症"   const ready=list.length&&resolvedCategory,matched=list.filter(p=>p.faqs.some(f=>f.category===resolvedCategory));$('confirmQuery').disabled=!ready||!matched.length;
  if(ready&&matched.length){const names=matched.slice(0,3).map(p=>p.name).join('、')+(matched.length>3?' 等 '+matched.length+' 項產品':'');$('queryPreview').innerHTML='<span class="preview-label">您要查詢的是</span><strong>'+esc(names)+' 的「'+esc(resolvedCategory)+'」</strong>';$('queryHint').textContent=matched.length>1?'符合 '+matched.length+' 項規格；按「查詢」後可在結果清單切換各項答案。':'確認品項與標準問法後，按「查詢」顯示答案。';}
  else{$('queryPreview').textContent=!tokens().length?'請先輸入商品名或成分名。':!list.length?'目前沒有符合的品項。':!$('question').value.trim()?'請輸入您想查詢的問題。':matches.length>1&&!resolvedCategory?'請點選上方其中一個建議問法。':'目前來源沒有符合的問法。';$('queryHint').textContent='輸入或修改條件時，下方資料保持空白；按「查詢」後才會顯示答案。';}}
function changeCriteria(){confirmed=false;selectedId='';updateChoices();render();}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function categories(){return [...new Set(DATA.products.flatMap(p=>p.faqs.map(f=>f.category)))];}
function hydrate(){const ing=[...new Set(DATA.products.map(p=>p.ingredient))];confirmed=false;updateChoices();$('productTotal').textContent=DATA.products.length;$('faqTotal').textContent=DATA.products.reduce((s,p)=>s+p.faqs.length,0);$('ingredientTotal').textContent=ing.length;
$('errors').innerHTML=(DATA.errors||[]).map(e=>`<div class="error">${esc(e)}</div>`).join('');render();}
function render(){$('resultsLayout').hidden=!confirmed;updateTray();if(!confirmed){$('products').innerHTML='';$('detail').innerHTML='';$('answers').innerHTML='';$('resultCount').textContent='';$('answerCount').textContent='';return;}const list=visibleProducts();if(!list.some(p=>p.id===selectedId))selectedId=list[0]?.id||'';$('resultCount').textContent=`${list.length} 項`;$('products').innerHTML=list.length?list.map(p=>`<button class="product ${p.id===selectedId?'selected':''}" data-product="${esc(p.id)}" aria-pressed="${p.id===selectedId}" aria-label="選擇 ${esc(p.name)}"><span class="en">${highlight(p.name)} ${saved.has(p.id)?'★':''}</span><span class="cn">${highlight(p.chinese)}</span><span class="product-bottom"><span class="tag">${esc(p.ingredient)}</span><span>${matchingFaqs(p).length} 則問答</span></span></button>`).join(''):'<div class="empty"><strong>沒有符合的產品問答</strong>請調整商品名、成分名或查詢問題。</div>';
const p=list.find(p=>p.id===selectedId);$('expandAll').disabled=!p;if(!p){$('detail').innerHTML='<div class="empty"><strong>查無符合結果</strong>可搜尋中英文品名、成分或問答文字。<br>若已開啟收藏，請先取消收藏篩選。</div>';$('answers').innerHTML='';$('answerCount').textContent='0 則';return;}
$('detail').innerHTML=`<article class="product-panel"><div class="detail-top"><div><span class="tag">${esc(p.ingredient)}</span><h2>${highlight(p.name)}</h2><p class="cn-title">${highlight(p.chinese)}</p></div><div class="actions"><button class="btn small ${saved.has(p.id)?'active':''}" id="saveProduct" aria-pressed="${saved.has(p.id)}">${saved.has(p.id)?'★ 已收藏':'☆ 收藏產品'}</button><button class="btn small ${compared.has(p.id)?'active':''}" id="addCompare">${compared.has(p.id)?'✓ 已加入比較':'＋ 加入比較'}</button></div></div><div class="meta-grid"><div class="meta-item"><span class="meta-label">成分與含量・來源原文</span>${highlight(p.ingredientText)}</div><div class="meta-item"><span class="meta-label">許可證字號</span>${highlight(p.license)}</div></div></article>`;
const faqs=matchingFaqs(p);$('answerCount').textContent=`${faqs.length} / ${p.faqs.length} 則`;$('answers').innerHTML=faqs.map((f,i)=>`<details class="faq" open><summary><span class="faq-index">${String(i+1).padStart(2,'0')}</span>${highlight(f.category)}</summary><div class="faq-body"><p class="answer">${highlight(f.answer)}</p>${f.note?`<div class="note"><strong>查核／使用提醒</strong>　${highlight(f.note)}</div>`:''}<div class="faq-footer" style="justify-content:flex-end"><button class="text-btn" data-copy="${f.row}">複製回答</button></div></div></details>`).join('');$('expandAll').textContent='展開全部';}
function updateTray(){$('compareTray').hidden=!confirmed||compared.size===0;$('compareText').textContent='比較清單（'+compared.size+'/3）：'+DATA.products.filter(p=>compared.has(p.id)).map(p=>p.name).join('、');$('openCompare').disabled=compared.size<2;}
function reset(){ $('search').value='';$('question').value='';selectedId='';onlySaved=false;$('favorites').classList.remove('active');$('favorites').setAttribute('aria-pressed','false');changeCriteria();}
function showInfo(title,html){$('infoTitle').textContent=title;$('infoBody').innerHTML=html;$('infoDialog').showModal();}
function help(){showInfo('來源與使用說明',`<p>第一欄輸入商品名或成分名，第二欄輸入問題。下方會列出符合品項、來源中的標準問法，以及完整詢問用詞。可點選指定規格或建議問法，再按「查詢」閱讀來源答案。遇到多種問法時，請先點選一個建議；修改輸入或清除後，下方資料會收起，須再次查詢。問題提示依來源分類與常見用語比對，答案仍完整沿用來源內容。</p><p>使用「收藏產品」保存常用產品；同題比較可加入 2–3 項產品。每則回答均保留原始仿單依據與查核提醒。</p><p><strong>資料更新：</strong>${DATA.mode==='live'?'目前為雲端版本。按更新資料會重新讀取來源資料夾。':'目前為本機資料快照，雙擊即可使用，不會自動同步 Google Drive。更新步驟請見同資料夾的「使用說明.html」。雲端即時版程式亦已附於 apps-script 資料夾，需由檔案擁有者完成部署。'}</p><p>原始文件會依 Google Drive 權限開啟；本頁不修改來源。PDF 連結依現有索引唯一檔名對應，未另驗證是否為最新版本。</p><p class="minor-note">來源資料夾：<a href="${esc(DATA.folderUrl)}" target="_blank" rel="noopener">開啟 Google Drive ↗</a></p>`);}
function renderComparison(){const cat=$('compareCategory').value;const ps=DATA.products.filter(p=>compared.has(p.id));$('compareGrid').style.gridTemplateColumns=`repeat(${ps.length},minmax(0,1fr))`;$('compareGrid').innerHTML=ps.map(p=>{const fs=p.faqs.filter(f=>f.category===cat);return `<article class="compare-card"><span class="tag">${esc(p.ingredient)}</span><h3>${esc(p.name)}</h3><div>${esc(p.chinese)}</div>${fs.length?fs.map(f=>`<p class="answer">${esc(f.answer)}</p>${f.note?`<div class="note">${esc(f.note)}</div>`:''}`).join(''):'<div class="empty">此產品來源未列此分類</div>'}</article>`;}).join('');}
async function refresh(){if(!(window.google&&google.script&&google.script.run)){help();return;}$('refresh').disabled=true;$('refresh').textContent='讀取中…';google.script.run.withSuccessHandler(data=>{try{if(!data||!Array.isArray(data.products))throw Error('資料格式不符');DATA=data;hydrate();toast('已重新讀取雲端資料');}catch(e){toast('讀取失敗，保留原資料');}finally{$('refresh').disabled=false;$('refresh').textContent='更新資料';}}).withFailureHandler(error=>{$('refresh').disabled=false;$('refresh').textContent='更新資料';$('errors').textContent='雲端讀取失敗，畫面保留上次資料：'+(error.message||error);$('errors').className='error';}).getLibraryData();}
$('search').addEventListener('input',changeCriteria);$('question').addEventListener('input',changeCriteria);$('reset').onclick=reset;$('favorites').onclick=()=>{onlySaved=!onlySaved;$('favorites').classList.toggle('active',onlySaved);$('favorites').setAttribute('aria-pressed',String(onlySaved));changeCriteria();};$('refresh').onclick=refresh;$('confirmQuery').onclick=()=>{if($('confirmQuery').disabled)return;confirmed=true;render();$('queryHint').textContent='已顯示上述詢問用詞的來源答案；修改輸入後請再次查詢。';};
document.querySelectorAll('[data-query]').forEach(el=>el.onclick=()=>{$('question').value=el.dataset.query;changeCriteria();});
$('nameSuggestions').onclick=e=>{const b=e.target.closest('[data-name]');if(!b)return;$('search').value=b.dataset.name;changeCriteria();};
$('questionSuggestions').onclick=e=>{const b=e.target.closest('[data-question]');if(!b)return;$('question').value=b.dataset.question;changeCriteria();};
for(const id of ['search','question'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!$('confirmQuery').disabled){e.preventDefault();$('confirmQuery').click();}});
$('products').onclick=e=>{const b=e.target.closest('[data-product]');if(!b)return;selectedId=b.dataset.product;try{history.replaceState(null,'','#'+encodeURIComponent(selectedId));}catch(err){}render();};
$('detail').onclick=e=>{const p=DATA.products.find(p=>p.id===selectedId);if(!p)return;const id=e.target.closest('button')?.id;if(id==='saveProduct'){saved.has(p.id)?saved.delete(p.id):saved.add(p.id);try{localStorage.setItem('leaflet-favorites-v1',JSON.stringify([...saved]));}catch(err){toast('此瀏覽器無法保存收藏，暫存於本次頁面');}render();}if(id==='addCompare'){if(compared.has(p.id))compared.delete(p.id);else if(compared.size>=3){toast('最多同時比較 3 項產品');return;}else compared.add(p.id);updateTray();render();}};
$('answers').onclick=async e=>{const button=e.target.closest('[data-copy]');if(!button)return;const p=DATA.products.find(p=>p.id===selectedId),f=p.faqs.find(f=>String(f.row)===button.dataset.copy);const t=`${p.name}／${p.chinese}\n${f.category}\n${f.answer}${f.note?'\n查核／使用提醒：'+f.note:''}`;try{await navigator.clipboard.writeText(t);toast('已複製回答');}catch(err){showInfo('複製回答','<p>請選取下方文字後複製。</p><textarea readonly style="width:100%;height:280px;font:inherit">'+esc(t)+'</textarea>');}};
$('expandAll').onclick=()=>{const details=[...document.querySelectorAll('.faq')];const open=details.some(d=>!d.open);details.forEach(d=>d.open=open);$('expandAll').textContent=open?'收合全部':'展開全部';};$('clearCompare').onclick=()=>{compared.clear();updateTray();render();};$('openCompare').onclick=()=>{const cats=categories();$('compareCategory').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');$('compareCategory').value=resolvedCategory||'用法用量';renderComparison();$('compareDialog').showModal();};$('compareCategory').onchange=renderComparison;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
try{selectedId=decodeURIComponent(location.hash.slice(1));}catch(err){}hydrate();if(window.google&&google.script&&google.script.run)refresh();
</script></body></html>
